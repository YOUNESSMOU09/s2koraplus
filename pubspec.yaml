name: marma
description: "Marma — a bright, gambling-free football scoreboard for the current three days."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^17.4.0

  # Networking
  dio: ^5.11.0

  # Local persistence
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Design system
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2

  # Platform utilities
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2960.0
  # Crest/badge images, disk-cached so the scoreboard still shows them offline.
  cached_network_image: ^3.4.1
  google_mobile_ads: ^9.0.0
  # iOS IDFA consent prompt — required before personalised ads can serve.
  app_tracking_transparency: ^2.0.4
  applovin_max: ^4.6.4
  goal_api: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/google_fonts/
    - assets/branding/

# ---------------------------------------------------------------------------
# Native splash (flutter_native_splash) — run: dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  # Solid brand blue, matching the first frame of the in-app splash gradient,
  # so launch is one continuous blue with no flash.
  color: "#1A5CFF"
  color_dark: "#1B3A8C"
  ios: true
  android: false
  web: false

# ---------------------------------------------------------------------------
# Launcher icons — step 10 replaces assets/icon/icon.png with the final artwork,
# then runs: dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  android: true
  remove_alpha_ios: true
  background_color_ios: "#1A5CFF"
  adaptive_icon_background: "#1A5CFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
